# Gerado pela skill cutout-video-builder.
# Como usar: suba este arquivo em  .github/workflows/exemplo-gerar-video.yml  de um repositório GitHub.
# O vídeo começa a ser gerado sozinho (ou: aba Actions > "Gerar video cutout" > Run workflow).
# Resultado: aba Actions > execução > "Artifacts" > video-pronto (baixe o .zip e abra o video.mp4).
name: Gerar video cutout

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/exemplo-gerar-video.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Baixar o repositório (para ler inputs/voz.mp3 e inputs/musica.mp3, se existirem)
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar ffmpeg, fontes e bibliotecas de animação
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install pillow numpy edge-tts

      - name: Baixar fonte das legendas (Lilita One)
        run: |
          mkdir -p assets/fonts
          curl -fsSL -o assets/fonts/LilitaOne-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/lilitaone/LilitaOne-Regular.ttf" || echo "Fonte não baixou, usando DejaVu Bold"

      - name: Escrever o plano do vídeo e o renderizador
        run: |
          mkdir -p build
          cat > plan.json <<'CVB_PLAN_EOF'
