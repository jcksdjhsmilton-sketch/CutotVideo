          # ----------------------------------------------------------------------------- legenda
          def caption_layer(text, s):
              toks = [(caption_clean(w), c) for w, c in parse_markup(text)]; size = 108
              while True:
                  f = font(size * s); sp = .3 * size * s; ws = [f.getbbox(w)[2] - f.getbbox(w)[0] for w, _ in toks]; tot = sum(ws) + sp * (len(toks) - 1)
                  if tot < .9 * W0 * s or size < 50: break
                  size -= 4
              im = Image.new("RGBA", (int(W0 * s), int(230 * s)), (0, 0, 0, 0)); d = ImageDraw.Draw(im); x = (im.width - tot) / 2
              for (w, c), wd in zip(toks, ws):
                  d.text((x, im.height / 2), w, font=f, fill=c, anchor="lm", stroke_width=max(2, int(size * .12 * s)), stroke_fill=(0, 0, 0)); x += wd + sp
              return im

          # ----------------------------------------------------------------------------- linha do tempo
          def build_timeline(plan, timing):
              beats, sc_of, first = [], [], []
              for si, sc in enumerate(plan["scenes"]):
                  first.append(len(beats))
                  for b in sc["beats"]:
                      b = dict(b); b.setdefault("say", strip_markup(b["text"])); beats.append(b); sc_of.append(si)
              n = [max(1, len(b["say"].split())) for b in beats]; tot = sum(n); dur = timing.get("duration", 0) or tot * .42 + 1.5; words = timing.get("words")
              starts, cum = [], 0
              if words:
                  kk = len(words) / tot
                  for ni in n: starts.append(words[min(len(words) - 1, int(round(cum * kk)))][0]); cum += ni
                  end = words[-1][1]
              else:
                  ch = [len(b["say"]) + 1 for b in beats]; span = max(dur - .55, 1); cum = 0
                  for c_ in ch: starts.append(.25 + span * cum / sum(ch)); cum += c_
                  end = .25 + span
              for i, b in enumerate(beats):
                  if "start" in b: starts[i] = float(b["start"])
              starts[0] = 0.0
              for i in range(1, len(starts)): starts[i] = max(starts[i], starts[i - 1] + .15)
              for i, b in enumerate(beats): b["_s"] = starts[i]; b["_e"] = starts[i + 1] if i + 1 < len(beats) else end + .5
              total = max(dur + .3, beats[-1]["_e"]); beats[-1]["_e"] = total
              return beats, sc_of, first, total

          # ----------------------------------------------------------------------------- frame
          G = {}
          def init(plan, timing, s):
              G.update(plan=plan, s=s, fps=plan.get("meta", {}).get("fps", 30)); G["beats"], G["sc_of"], G["first"], G["total"] = build_timeline(plan, timing)
              G["chars"] = plan.get("characters", {"main": dict(skin="#d99a62", shirt="#2f7de1", pants="#233a78", hair="#14141e")})

          def render_frame(i):
              s, plan, beats = G["s"], G["plan"], G["beats"]; t = i / G["fps"]
              g = max(j for j, b in enumerate(beats) if b["_s"] <= t); si = G["sc_of"][g]; sc = plan["scenes"][si]; f0 = G["first"][si]; lb = g - f0
              t0 = beats[f0]["_s"] if si else 0.0; nxt = G["first"][si + 1] if si + 1 < len(G["first"]) else None
              t1 = beats[nxt]["_s"] if nxt else G["total"]; ts = t - t0
              img = make_bg(sc, si, s, t).convert("RGBA"); w, h = img.size
              for pi, p in enumerate(sc.get("props", [])):                                  # props
                  at = p.get("at", 0); un = p.get("until")
                  if lb < at or (un is not None and lb >= un): continue
                  tp = t - beats[f0 + at]["_s"]; c = dict(t=tp, nb=lb - at, dur=t1 - t0); key = (si, pi, prop_key(p, c))
                  if key not in _PCACHE:
                      if len(_PCACHE) > 400: _PCACHE.clear()
                      _PCACHE[key] = PROPS[p["kind"]](p, s, c)
                  lay = _PCACHE[key]; pop = back(tp / .28) if tp < .28 else 1.0; pul = 1 + .025 * math.sin(tp * 5 + pi)
                  z = p.get("scale", 1) * pop * pul
                  if z < .02: continue
                  lay = lay.resize((max(1, int(lay.width * z)), max(1, int(lay.height * z))), Image.BILINEAR)
                  rot = p.get("rot", 0) * 1 + (math.sin(tp * 4 + pi) * 1.5 if p.get("kind") in ("tag", "stamp") else 0)
                  if rot: lay = lay.rotate(rot, expand=True, resample=Image.BICUBIC)
                  fy = 0 if p.get("kind") == "hud" else math.sin(tp * 3 + pi) * 9 * s
                  img.alpha_composite(lay, (int(p.get("x", .5) * w - lay.width / 2), int(p.get("y", .3) * h - lay.height / 2 + fy)))
              cl = sc.get("chars") or ([sc["char"]] if sc.get("char") else [])                # personagens
              b = beats[g]
              for ci, ch in enumerate(cl):
                  cd = G["chars"].get(ch.get("id", "main"), list(G["chars"].values())[0])
                  pose = (b.get("pose") if ci == 0 else None) or ch.get("pose", "idle"); expr = (b.get("expr") if ci == 0 else None) or ch.get("expression", "neutral")
                  prev = None; tch = b["_s"]
                  if lb > 0 and ci == 0:
                      pb = beats[g - 1]; prev = pb.get("pose") or ch.get("pose", "idle")
                      if prev == pose: prev = None
                  talking = b["_s"] <= t < b["_e"] - .05
                  st = char_state(cd, pose, prev, tch, expr, t, talking, ci * 1.7, ci)
                  zc = ch.get("scale", 1.0); ent = ch.get("enter", "pop"); te = ts
                  zz = back(te / .35) if ent == "pop" and te < .35 else 1.0
                  if zz < .03: continue
                  lay = draw_char(cd, st, s * zc * zz)
                  cx = ch.get("x", .5) * w + (-(1 - ease_out(te / .35)) * 500 * s * (1 if ch.get("x", .5) < .5 else -1) if ent == "slide" and te < .35 else 0)
                  cy = ch.get("y", .66) * h; px = int(cx - lay.width * 400 / 800) ; py = int(cy - lay.height * 960 / 1000)
                  if ch.get("flip"): lay = lay.transpose(Image.FLIP_LEFT_RIGHT)
                  img.alpha_composite(lay, (px, py))
              if b["text"]:                                                                  # legenda
                  ck = ("cap", g)
                  if ck not in _PCACHE: _PCACHE[ck] = caption_layer(b["text"], s)
                  cap = _PCACHE[ck]; tb = t - b["_s"]; z = .65 + .35 * back(tb / .16) if tb < .16 else 1.0
                  rot = (-1 if g % 2 else 1) * 2.5 * (1 - clamp(tb / .3))
                  cap = cap.resize((max(1, int(cap.width * z)), max(1, int(cap.height * z))), Image.BILINEAR)
                  if rot: cap = cap.rotate(rot, expand=True, resample=Image.BICUBIC)
                  img.alpha_composite(cap, (int(w / 2 - cap.width / 2), int(.745 * h - cap.height / 2)))
              if si and ts < .14:                                                            # flash na troca de cena
                  fl = Image.new("RGBA", img.size, (255, 255, 255, int(150 * (1 - ts / .14)))); img.alpha_composite(fl)
              return img.convert("RGB").tobytes()

          # ----------------------------------------------------------------------------- audio / timing
          def ffprobe_dur(p):
              r = subprocess.run(["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "csv=p=0", p], capture_output=True, text=True)
              try: return float(r.stdout.strip())
              except ValueError: return 0.0

          async def tts_edge(text, voice, rate, out):
              import edge_tts
              try: com = edge_tts.Communicate(text, voice, rate=rate, boundary="WordBoundary")
              except TypeError: com = edge_tts.Communicate(text, voice, rate=rate)
              words = []
              with open(out, "wb") as f:
                  async for ch in com.stream():
                      if ch["type"] == "audio": f.write(ch["data"])
                      elif ch["type"] == "WordBoundary": st = ch["offset"] / 1e7; words.append((st, st + ch["duration"] / 1e7))
              return words

          def whisper_words(path):
              from faster_whisper import WhisperModel
              m = WhisperModel("small", device="cpu", compute_type="int8"); segs, _ = m.transcribe(path, language="pt", word_timestamps=True)
              return [(w.start, w.end) for sg in segs for w in sg.words]

          def cmd_prepare(a):
              plan = json.load(open(a.plan, encoding="utf-8")); meta = plan.get("meta", {}); os.makedirs("build", exist_ok=True)
              say = " ".join(strip_markup(b.get("say", b["text"])) for sc in plan["scenes"] for b in sc["beats"])
              user = [p for p in sorted(glob.glob("inputs/voz.*")) if os.path.isfile(p)]; timing = {}
              if user:
                  out = "build/audio" + os.path.splitext(user[0])[1]; subprocess.run(["cp", user[0], out], check=True); words = None
                  if meta.get("timing", "whisper") == "whisper":
                      try: words = whisper_words(out)
                      except Exception as e: print("whisper indisponível, usando tempo proporcional:", e)
                  timing = dict(audio=out, duration=ffprobe_dur(out), words=words, source="user")
              elif meta.get("voice", "pt-BR-AntonioNeural") != "none":
                  out = "build/audio.mp3"; words = asyncio.run(tts_edge(say, meta.get("voice", "pt-BR-AntonioNeural"), meta.get("rate", "+8%"), out))
                  timing = dict(audio=out, duration=ffprobe_dur(out), words=words or None, source="edge-tts")
              json.dump(timing, open("build/timing.json", "w")); print("timing:", {k: (v if k != "words" else (len(v) if v else None)) for k, v in timing.items()})

          def cmd_render(a):
              plan = json.load(open(a.plan, encoding="utf-8")); timing = json.load(open("build/timing.json")) if os.path.exists("build/timing.json") else {}
              if a.audio: timing = dict(timing, audio=a.audio, duration=ffprobe_dur(a.audio))
              s = a.scale; init(plan, timing, s); fps = G["fps"]; n = int(math.ceil(G["total"] * fps)); w, h = int(W0 * s), int(H0 * s)
              if a.frame is not None:
                  Image.frombytes("RGB", (w, h), render_frame(int(a.frame * fps))).save(a.out); print("frame salvo em", a.out); return
              cmd = ["ffmpeg", "-y", "-v", "error", "-f", "rawvideo", "-pix_fmt", "rgb24", "-s", f"{w}x{h}", "-r", str(fps), "-i", "-"]
              au = timing.get("audio"); mus = (glob.glob("inputs/musica.*") or [None])[0]
              if au: cmd += ["-i", au]
              if au and mus:
                  cmd += ["-stream_loop", "-1", "-i", mus, "-filter_complex", f"[2:a]volume={plan.get('meta', {}).get('music_volume', .12)}[m];[1:a][m]amix=inputs=2:duration=first:dropout_transition=0[a]", "-map", "0:v", "-map", "[a]"]
              elif au: cmd += ["-map", "0:v", "-map", "1:a"]
              cmd += ["-c:v", "libx264", "-preset", "medium", "-crf", "18", "-pix_fmt", "yuv420p", "-t", f"{G['total']:.3f}"]
              if au: cmd += ["-c:a", "aac", "-b:a", "192k", "-af", "apad"] if not mus else ["-c:a", "aac", "-b:a", "192k"]
              cmd += ["-movflags", "+faststart", a.out]
              pr = subprocess.Popen(cmd, stdin=subprocess.PIPE); workers = a.workers or os.cpu_count() or 2
              print(f"{n} frames @ {fps}fps ({G['total']:.1f}s) {w}x{h} | {workers} processos")
              with Pool(workers, initializer=init, initargs=(plan, timing, s)) as pool:
                  for k, fr in enumerate(pool.imap(render_frame, range(n), chunksize=8)):
                      pr.stdin.write(fr)
                      if k % 150 == 0: print(f"  {k}/{n}", flush=True)
              pr.stdin.close(); pr.wait(); print("ok ->", a.out, "| código ffmpeg:", pr.returncode); sys.exit(pr.returncode)

          if __name__ == "__main__":
              ap = argparse.ArgumentParser(); ap.add_argument("cmd", choices=["prepare", "render"]); ap.add_argument("--plan", default="plan.json")
              ap.add_argument("--out", default="video.mp4"); ap.add_argument("--audio"); ap.add_argument("--scale", type=float, default=1.0)
              ap.add_argument("--workers", type=int, default=0); ap.add_argument("--frame", type=float, help="renderiza só 1 frame (segundos) em PNG")
              a = ap.parse_args(); {"prepare": cmd_prepare, "render": cmd_render}[a.cmd](a)
          CVB_PY_EOF

      - name: Instalar reconhecimento de fala (só se você enviou inputs/voz.*)
        run: |
          if ls inputs/voz.* >/dev/null 2>&1; then python -m pip install faster-whisper; else echo "Sem inputs/voz.*, vou gerar a voz com edge-tts"; fi

      - name: Gerar voz e marcar o tempo de cada frase
        run: python render_video.py prepare --plan plan.json

      - name: Renderizar o vídeo (1080x1920, 30 fps)
        run: python render_video.py render --plan plan.json --out video.mp4

      - name: Gerar capa (PNG)
        run: python render_video.py render --plan plan.json --frame 1.5 --out capa.png

      - name: Salvar resultado
        uses: actions/upload-artifact@v4
        with:
          name: video-pronto
          path: |
            video.mp4
            capa.png
          retention-days: 14
