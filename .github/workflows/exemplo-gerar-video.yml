          def tokens_code(line):
              out = []
              for m in re.finditer(r'"[^"]*"|\b(?:def|return|class|import|for|in|if)\b|\w+(?=\()|\s+|.', line):
                  t = m.group(0)
                  c = (255, 121, 198) if t in ("def", "return", "class", "import", "for", "in", "if") else (241, 250, 140) if t.startswith('"') else (139, 233, 253) if re.fullmatch(r"\w+", t) and line[m.end():m.end() + 1] == "(" else (220, 230, 255)
                  out.append((t, c))
              return out

