          #!/usr/bin/env python3
          """
          cutout-video-builder :: renderizador
            python render_video.py prepare   -> gera build/audio.* e build/timing.json (TTS ou áudio do usuário)
            python render_video.py render    -> lê plan.json + timing e gera o mp4 vertical 9:16
          Dependências: pillow, numpy, ffmpeg (+ edge-tts / faster-whisper só no `prepare`).
          """
          import argparse, asyncio, glob, json, math, os, random, re, subprocess, sys
          from functools import lru_cache
          from multiprocessing import Pool

          import numpy as np
          from PIL import Image, ImageDraw, ImageFont

          W0, H0 = 1080, 1920
          INK = (22, 22, 36)
          YEL, RED, GRN, WHT = (255, 214, 10), (255, 59, 48), (52, 199, 89), (255, 255, 255)
          PALETTE = {"yellow": ((255, 204, 0), INK), "white": ((255, 255, 255), INK), "green": ((52, 199, 89), WHT),
                     "red": ((255, 59, 48), WHT), "blue": ((46, 125, 225), WHT), "dark": ((20, 26, 56), WHT)}

          # ----------------------------------------------------------------------------- utils
          def hx(c):
              if isinstance(c, (tuple, list)): return tuple(c)
              c = c.lstrip("#"); return tuple(int(c[i:i + 2], 16) for i in (0, 2, 4))
          def lerp(a, b, t): return a + (b - a) * t
          def clamp(x, a=0.0, b=1.0): return max(a, min(b, x))
          def ease_out(t): t = clamp(t); return 1 - (1 - t) ** 3
          def back(t, c1=2.2):
              t = clamp(t); return 1 + (c1 + 1) * (t - 1) ** 3 + c1 * (t - 1) ** 2
          def rad(a): return math.radians(a)

          FONTS = [os.environ.get("CVB_FONT", ""), "assets/fonts/LilitaOne-Regular.ttf", "fonts/LilitaOne-Regular.ttf",
                   "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"]
          MONOS = ["/usr/share/fonts/truetype/dejavu/DejaVuSansMono-Bold.ttf", "/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf"]
          @lru_cache(None)
          def font(px, mono=False):
              px = max(6, int(px))
              for p in (MONOS if mono else FONTS):
                  if p and os.path.exists(p): return ImageFont.truetype(p, px)
              return ImageFont.load_default()

          def parse_markup(text):
              """*amarelo*  ~vermelho~  ^verde^  -> [(palavra, cor)]"""
              text = re.sub(r"([*~^])([!?.,;:]+)", r"\2\1", text)      # pontuação fica colada na palavra
              cols = {"*": YEL, "~": RED, "^": GRN}; cur, buf, out = WHT, "", []
              def flush():
                  nonlocal buf
                  out.extend((w, cur) for w in buf.split()); buf = ""
              for ch in text:
                  if ch in cols:
                      flush(); cur = WHT if cur == cols[ch] else cols[ch]
                  else: buf += ch
              flush(); return out
          def strip_markup(t): return re.sub(r"[*~^]", "", t)
          def caption_clean(w): return re.sub(r"[,.;:]", "", w).upper()

          # ----------------------------------------------------------------------------- camada supersampleada
          class Layer:
              def __init__(s, w, h, k, ss=2):
                  s.k, s.ss, s.m = k, ss, k * ss; s.w, s.h = w, h
                  s.im = Image.new("RGBA", (max(2, int(w * s.m)), max(2, int(h * s.m))), (0, 0, 0, 0)); s.d = ImageDraw.Draw(s.im)
              def p(s, x, y): return (x * s.m, y * s.m)
              def pts(s, a): return [(x * s.m, y * s.m) for x, y in a]
              def poly(s, a, fill, ow=8, oc=INK):
                  a = s.pts(a); s.d.polygon(a, fill=fill)
                  if ow: s.d.line(a + [a[0]], fill=oc, width=int(ow * s.m), joint="curve")
              def ell(s, cx, cy, rx, ry, fill, ow=8, oc=INK):
                  s.d.ellipse([(cx - rx) * s.m, (cy - ry) * s.m, (cx + rx) * s.m, (cy + ry) * s.m], fill=fill, outline=oc if ow else None, width=int(ow * s.m) if ow else 0)
              def rr(s, x0, y0, x1, y1, r, fill, ow=8, oc=INK):
                  s.d.rounded_rectangle([x0 * s.m, y0 * s.m, x1 * s.m, y1 * s.m], radius=r * s.m, fill=fill, outline=oc if ow else None, width=int(ow * s.m) if ow else 0)
              def cap(s, p1, p2, r, fill, ow=8, oc=INK):
                  for rr_, col in ((r + ow, oc), (r, fill)):
                      if rr_ <= 0: continue
                      s.d.line([s.p(*p1), s.p(*p2)], fill=col, width=int(2 * rr_ * s.m))
                      for q in (p1, p2): s.ell(q[0], q[1], rr_, rr_, col, 0)
              def line(s, a, w, col, joint="curve"): s.d.line(s.pts(a), fill=col, width=int(w * s.m), joint=joint)
              def text(s, x, y, t, size, fill=WHT, stroke=0, anchor="mm", mono=False, sc=INK):
                  s.d.text((x * s.m, y * s.m), t, font=font(size * s.m, mono), fill=fill, anchor=anchor,
                           stroke_width=int(stroke * s.m), stroke_fill=sc)
              def tw(s, t, size, mono=False):
                  b = font(size * s.m, mono).getbbox(t); return (b[2] - b[0]) / s.m
              def done(s):
                  if s.ss == 1: return s.im
                  return s.im.resize((max(1, int(s.w * s.k)), max(1, int(s.h * s.k))), Image.LANCZOS)

          # ----------------------------------------------------------------------------- personagem
          def pose_angles(name, t):
              w = math.sin(t * 8)
              P = {"idle": ((12, 8), (12, 8)), "point_right": ((12, 8), (88, 92)), "point_left": ((88, 92), (12, 8)),
                   "open": ((62, 80), (62, 80)), "cheer": ((150, 168), (150, 168)), "thumb": ((14, 8), (70, 172)),
                   "shrug": ((38, 100), (38, 100)), "wave": ((12, 8), (140, 150 + 22 * w)),
                   "think": ((12, 8), (40, 205)), "hips": ((45, -35), (45, -35)),
                   "dance": ((120 + 50 * math.sin(t * 7), 150 + 30 * math.sin(t * 7)), (120 - 50 * math.sin(t * 7), 150 - 30 * math.sin(t * 7)))}
              return P.get(name, P["idle"])

          def draw_char(cd, st, k):
              ss = 2 if k <= 1.3 else 1.25
              L = Layer(800, 1000, k, ss); ox, oy = 400, 960
              skin, shirt, pants = hx(cd["skin"]), hx(cd["shirt"]), hx(cd["pants"])
              hair, shoe = hx(cd["hair"]), hx(cd.get("shoes", "#ffffff"))
              bob, sway = st["bob"], st["sway"]
              for side in (-1, 1):                                                    # pernas
                  lift = st["lift"][0 if side < 0 else 1]
                  hip = (ox + side * 48 + sway * .5, oy - 255 + bob); ank = (ox + side * 58 + sway * .2, oy - 34 - lift)
                  L.cap(hip, ank, 40, pants); L.ell(ank[0] + side * 12, ank[1] + 14, 64, 30, shoe)
              L.rr(ox - 100 + sway, oy - 505 + bob, ox + 100 + sway, oy - 232 + bob, 62, shirt)   # tronco
              L.rr(ox - 84 + sway, oy - 262 + bob, ox + 84 + sway, oy - 232 + bob, 14, pants, 6)    # cintura
              for side in (-1, 1):                                                    # braços
                  sh = (ox + side * 98 + sway, oy - 470 + bob); a1, a2 = st["arms"][0 if side < 0 else 1]
                  el = (sh[0] + side * math.sin(rad(a1)) * 125, sh[1] + math.cos(rad(a1)) * 125)
                  wr = (el[0] + side * math.sin(rad(a2)) * 115, el[1] + math.cos(rad(a2)) * 115)
                  L.cap(sh, el, 32, shirt); L.cap(el, wr, 29, shirt); L.ell(wr[0], wr[1], 36, 36, skin)
              hx0, hy0 = ox + sway + st["hx"], oy - 655 + bob + st["hy"]
              L.rr(hx0 - 38, hy0 + 100, hx0 + 38, hy0 + 190, 20, skin)                # pescoço
              L.ell(hx0 - 148, hy0 + 10, 30, 38, skin); L.ell(hx0 + 148, hy0 + 10, 30, 38, skin)   # orelhas
              L.ell(hx0, hy0, 150, 160, skin)                                         # cabeça
              rnd = random.Random(7)                                                  # cabelo
              top = []
              for i in range(11):
                  a = rad(188 + 164 * i / 10); r = 1.0 if i % 2 else 1.0 + (0.34 if cd.get("hair_style", "spiky") == "spiky" else 0.1) * (0.75 + 0.5 * rnd.random())
                  top.append((hx0 + 150 * r * math.cos(a), hy0 + 160 * r * math.sin(a) * (1 if i % 2 else 1.02)))
              top += [(hx0 + 140, hy0 - 40), (hx0 + 70, hy0 - 98), (hx0 + 5, hy0 - 80), (hx0 - 62, hy0 - 104), (hx0 - 140, hy0 - 40)]
              L.poly(top, hair, 8)
              ex = st["expr"]; lk = st.get("look", (0, 0)); op = st["blink"]                # rosto
              for side in (-1, 1):
                  cx, cy = hx0 + side * 58, hy0 + 14
                  if ex == "happy" or (ex == "wink" and side == 1) or op < 0.18:
                      L.d.arc([(cx - 34) * L.m, (cy - 20) * L.m, (cx + 34) * L.m, (cy + 24) * L.m], 200, 340, fill=INK, width=int(9 * L.m))
                  else:
                      big = 1.25 if ex == "shock" else 1.0; hgt = 44 * big * (0.5 if ex == "tired" else 1) * op
                      L.ell(cx, cy, 34 * big, hgt, WHT, 6)
                      pr = (13 if ex == "shock" else 17); L.ell(cx + lk[0] * 8 + side * -2, cy + lk[1] * 8, pr, pr * 1.15, INK, 0)
                      if ex == "tired": L.d.rectangle([(cx - 40) * L.m, (cy - hgt - 6) * L.m, (cx + 40) * L.m, (cy - hgt * .1) * L.m], fill=skin)
                  br = {"shock": 24, "happy": 10, "tired": -6, "think": 14 if side == 1 else 0}.get(ex, 4)
                  L.line([(cx - 30, cy - 62 - br + (side * -4)), (cx + 30, cy - 66 - br + (side * 4 if ex != "tired" else 0))], 9, INK)
              L.ell(hx0 - 88, hy0 + 55, 24, 16, (236, 128, 112), 0); L.ell(hx0 + 88, hy0 + 55, 24, 16, (236, 128, 112), 0)   # blush
              L.poly([(hx0 - 8, hy0 + 40), (hx0 + 10, hy0 + 40), (hx0 + 2, hy0 + 52)], tuple(int(c * .75) for c in skin), 0)  # nariz
              mx, my, m = hx0, hy0 + 98, st["mouth"]
              if ex in ("happy",):
                  h = 28 + 46 * m
                  L.d.pieslice([(mx - 66) * L.m, (my - h * .9) * L.m, (mx + 66) * L.m, (my + h) * L.m], 0, 180, fill=(70, 20, 35), outline=INK, width=int(7 * L.m))
                  L.d.rectangle([(mx - 56) * L.m, (my - 4) * L.m, (mx + 56) * L.m, (my + 14) * L.m], fill=WHT)
              elif ex == "shock":
                  L.ell(mx, my + 6, 38, 36 + 38 * m, (70, 20, 35), 7); L.ell(mx, my + 28 + 18 * m, 24, 14 + 8 * m, (236, 110, 130), 0)
              elif ex in ("tired", "think"):
                  L.line([(mx - 34, my + 6), (mx, my + (14 if ex == "think" else 2)), (mx + 34, my + 4)], 8, INK)
              else:
                  h = 10 + 62 * m; L.ell(mx, my + h * .3, 33, h, (70, 20, 35), 7)
                  if m > .35: L.ell(mx, my + h * .75, 20, h * .32, (236, 110, 130), 0)
              return L.done()

          def char_state(cd, pose, prev_pose, t_change, expr, t, talking, mouth_phase, idx):
              cur, prv = pose_angles(pose, t), pose_angles(prev_pose or pose, t)
              e = ease_out((t - t_change) / 0.2) if prev_pose else 1.0
              wob = 5 * math.sin(t * 3 + idx)
              arms = tuple((lerp(prv[j][0], cur[j][0], e) + wob * (j * 2 - 1), lerp(prv[j][1], cur[j][1], e) + wob) for j in (0, 1))
              dancing = pose == "dance"; ph = t * 7
              bob = math.sin(t * 2 * math.pi * 1.4 + idx) * 7 + (math.sin(t * 2 * math.pi * 5) * 3 if talking else 0)
              if dancing: bob = -abs(math.sin(ph)) * 28
              lift = (max(0, math.sin(ph)) * 44, max(0, -math.sin(ph)) * 44) if dancing else (0, 0)
              sway = math.sin(ph / 2) * 26 if dancing else math.sin(t * 1.3 + idx) * 5
              tt = (t + idx * 1.3) % 3.2; blink = abs(math.cos(math.pi * tt / 0.16)) if tt < 0.16 else 1.0
              mouth = (0.45 + 0.55 * abs(math.sin(t * 17 + mouth_phase))) * (0.6 + 0.4 * math.sin(t * 5.3)) if talking else 0.08
              look = (0, -1) if expr == "think" else (math.sin(t * .9), 0)
              return dict(arms=arms, bob=bob, sway=sway, lift=lift, blink=blink, mouth=clamp(mouth), expr=expr, look=look,
                          hx=math.sin(t * 1.7 + idx) * 5 + (math.sin(t * 12) * 4 if talking else 0), hy=math.sin(t * 6) * 2 if talking else 0)

          # ----------------------------------------------------------------------------- fundos
          _BASE, _GRID = {}, {}
          BG_DEFAULT = {"sunburst": ["#ffd54a", "#ff8a1f"], "street": ["#8fd0ff", "#dff3ff"], "room": ["#f6e7c1", "#b98a56"],
                        "grid": ["#0b1230", "#152250"], "gradient": ["#ffb3d9", "#9b7cf0"]}
          def ang_grid(w, h, cx, cy):
              key = (w, h, cx, cy)
              if key not in _GRID:
